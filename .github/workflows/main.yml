name: WordPress Flood Bot

on:
  push:
  schedule:
    - cron: '*/10 * * * *' # Roda a cada 10 minutos

jobs:
  flood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run Attack
        run: python code.py
